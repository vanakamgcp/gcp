<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJITHKUMAR - GCP Data Engineer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4285F4;
            --secondary: #34A853;
            --accent: #FBBC05;
            --dark: #1A1A1D;
            --light: #F5F5F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header Styles */
        .hero {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 4rem 0;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.9);
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 4rem 0;
        }

        .skill-card {
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>AJITHKUMAR</h1>
            <p>GCP Data Engineer</p>
        </div>

        <div class="skills-grid">
            <!-- Skill Cards -->
            <div class="skill-card">
                <i class="fab fa-google cloud-icon"></i>
                <h3>Google Cloud Platform</h3>
                <p>Dataflow, BigQuery, Pub/Sub</p>
            </div>

            <div class="skill-card">
                <i class="fas fa-database"></i>
                <h3>Data Engineering</h3>
                <p>ETL Pipelines, Data Warehousing</p>
            </div>

            <div class="skill-card">
                <i class="fas fa-chart-line"></i>
                <h3>Data Analysis</h3>
                <p>BigQuery SQL, Data Studio</p>
            </div>

            <div class="skill-card">
                <i class="fas fa-code"></i>
                <h3>Programming</h3>
                <p>Python, SQL</p>
            </div>
        </div>
    </div>
</body>
</html>
