<!DOCTYPE html>
<html>
<head>
    <style>
        .candle-container {
            position: relative;
            width: 100px;
            height: 350px;
            margin: 50px auto;
        }

        .candle {
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 200px;
            background: #fd9644;
            border-radius: 5px;
            margin: 0 auto;
            left: 35px;
            box-shadow: 
                inset -5px 0 0 #fa8231,
                0 10px 30px rgba(255, 165, 0, 0.2);
            animation: candle-shadow 2s infinite;
        }

        /* New wick element */
        .wick {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 15px;
            background: #2d2d2d;
            border-radius: 2px 2px 0 0;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .flame {
            position: absolute;
            top: 75px;
            left: 50%;
            margin-left: -7.5px;
            width: 25px;
            height: 70px;
            background: linear-gradient(180deg, #ffd700 10%, #ff4500 70%);
            border-radius: 50% 50% 35% 35%;
            animation: flicker 0.1s infinite, flame-size 2s infinite;
            transform-origin: bottom center;
            filter: blur(1px);
            z-index: 2;
        }

        .flame::after {
            content: '';
            position: absolute;
            top: 60%;
            left: -5px;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle at 50% 40%, #ff4500, transparent 70%);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.6;
            animation: after-glow 1.5s infinite;
        }

        /* Previous animations remain the same */
        @keyframes flicker {
            0%, 100% { transform: rotate(-0.5deg) scaleY(1.1); }
            20% { transform: rotate(1deg) scaleY(1.15) skewX(2deg); }
            40% { transform: rotate(-1deg) scaleY(1.2); }
            60% { transform: rotate(1.5deg) scaleY(1.05); }
            80% { transform: rotate(-0.5deg) scaleY(1.1); }
        }

        @keyframes flame-size {
            0%, 100% { height: 70px; border-radius: 50% 50% 35% 35%; }
            50% { height: 80px; border-radius: 40% 40% 30% 30%; }
        }

        @keyframes after-glow {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .glow {
            position: absolute;
            top: -100px;
            left: -40px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 50% 40%, rgba(255, 165, 0, 0.3), transparent 60%);
            animation: glow 2s infinite;
            filter: blur(20px);
        }

        /* Rest of the CSS remains unchanged */
        /* ... */

    </style>
</head>
<body>
    <div class="candle-container">
        <div class="glow"></div>
        <div class="flame"></div>
        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>
        <div class="candle">
            <div class="wick"></div> <!-- Added wick element -->
            <div class="wax-drip"></div>
            <div class="wax-drip"></div>
        </div>
    </div>
</body>
</html>
